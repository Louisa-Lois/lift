packages:
  - apps/*
  - packages/*
  - evals
  - e2e

# One version of each library the whole repo shares. A package uses it with "catalog:"
# instead of a version number. Add a library here when a second package starts using it.
catalog:
  "@biomejs/biome": 2.6.8
  # The live editor's client and server must speak the same Hocuspocus protocol.
  "@hocuspocus/provider": 4.8.0
  "@types/node": ^24.19.2
  # BullMQ at least two weeks old (6.7.7 was two days old on Nov 19); bump deliberately.
  bullmq: 6.7.0
  drizzle-orm: ^0.45.4
  fastify: ^5.12.8
  ioredis: ^6.0.0
  msw: 3.0.7
  postgres: ^3.4.9
  tsup: ^8.5.1
  tsx: ^4.23.15
  turbo: 2.11.11
  # TypeScript 7 (the native compiler) has no JavaScript API yet, which Next.js and drizzle-kit
  # need. Stay on 6.x, the last JavaScript release, until they support 7.
  typescript: 6.0.3
  vitest: ^5.1.0
  y-protocols: ^1.0.7
  yjs: ^13.6.33
  zod: ^4.6.7

# Dependencies allowed to run install scripts (pnpm blocks all others).
onlyBuiltDependencies:
  - esbuild
