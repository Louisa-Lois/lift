# lift-pg's client authentication (INF-10): only the worker administers this server, and each
# project's role gets into its own database and no other. lift-release.sh copies this folder to
# /opt/lift/config/lift-pg, which lift-pg mounts; `up` reloads it, so an edit needs no restart.
#
# TYPE  DATABASE  USER      ADDRESS          METHOD

# Inside the container: the health check, and `docker exec lift-pg psql -U postgres`.
local   all       all                        trust

# The superuser, from lift-system only (the worker). Never from a project's network.
host    all       postgres  172.30.0.0/24    scram-sha-256
host    all       postgres  all              reject

# Every other role only into the database named like itself: a project's database and its role
# are both named after the database ID. The worker also revokes CONNECT from PUBLIC.
host    sameuser  all       all              scram-sha-256
host    all       all       all              reject
